name: AgentCoaming
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: $(COAMING_TEAM_ID)
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(COAMING_CURSOR_CONDITION)
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(COAMING_CURSOR_CONDITION)
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  CoamingCore:
    path: CoamingCore
  # Pinned. scripts/release-dmg.sh downloads the matching command line tools and checks their hash.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  CoamingHost:
    type: application
    platform: macOS
    sources:
      - path: CoamingHost
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: scripts/claude-statusline.sh
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.toritori0318.agentcoaming
      PRODUCT_NAME: "Agent Coaming"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_FILE: CoamingHost/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_ENTITLEMENTS: CoamingHost/CoamingHost.entitlements
      ENABLE_APP_SANDBOX: NO
      ENABLE_HARDENED_RUNTIME: YES
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    dependencies:
      - package: CoamingCore
        product: CoamingCore
      - package: Sparkle
        product: Sparkle
      - target: CoamingWidget
        embed: true
    # Xcode's Embed Frameworks phase looks for a product named Sparkle-product
    # and then rejects that bundle. Copy the real framework after the link and
    # sign its nested code. Xcode signs the app itself after this phase.
    postBuildScripts:
      - name: Embed Sparkle
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          src="${BUILT_PRODUCTS_DIR}/Sparkle.framework"
          frameworks="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          dest="${frameworks}/Sparkle.framework"
          rm -rf "${frameworks}/Sparkle-product" "$dest"
          mkdir -p "$frameworks"
          cp -R "$src" "$dest"
          if [[ "${CODE_SIGNING_ALLOWED:-YES}" == "NO" ]]; then
            exit 0
          fi
          identity="${EXPANDED_CODE_SIGN_IDENTITY:-}"
          if [[ -z "$identity" ]]; then
            echo "No code signing identity for Sparkle."
            exit 1
          fi
          sign_nested() {
            /usr/bin/codesign --force --sign "$identity" -o runtime --timestamp=none \
              --preserve-metadata=identifier,entitlements,flags --generate-entitlement-der "$1"
          }
          sign_nested "$dest/Versions/B/XPCServices/Downloader.xpc"
          sign_nested "$dest/Versions/B/XPCServices/Installer.xpc"
          sign_nested "$dest/Versions/B/Updater.app"
          sign_nested "$dest/Versions/B/Autoupdate"
          sign_nested "$dest"
  CoamingWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: CoamingWidget
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.toritori0318.agentcoaming.widget
      PRODUCT_NAME: CoamingWidget
      INFOPLIST_FILE: CoamingWidget/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_ENTITLEMENTS: CoamingWidget/CoamingWidget.entitlements
      ENABLE_APP_SANDBOX: YES
      ENABLE_HARDENED_RUNTIME: YES
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks
    dependencies:
      - package: CoamingCore
        product: CoamingCore
schemes:
  CoamingHost:
    build:
      targets:
        CoamingHost: all
        CoamingWidget: all
    run:
      config: Debug
